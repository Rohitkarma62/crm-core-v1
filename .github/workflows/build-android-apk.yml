name: Build Android APK
# APK build trigger enabled

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Capacitor
        working-directory: frontend
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Build web app
        working-directory: frontend
        run: npm run build

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk Vishwakarma-CRM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishwakarma-CRM-APK
          path: Vishwakarma-CRM.apk
          retention-days: 30
